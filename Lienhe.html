    <link rel="icon" href="images/logo.png" type="image/x-icon">

    <script language="javascript">
        function kiemtra() {
            var name = document.forms["lienhe"]["name"].value;
            var email = document.forms["lienhe"]["email"].value;
            var phone = document.forms["lienhe"]["phone"].value;
            var message = document.forms["lienhe"]["message"].value;

            if (name.length == 0) {
                alert("Vui lòng cho chúng tôi biết tên của bạn");
                document.forms["lienhe"]["name"].focus();
                return false;
            }

            if (email.length == 0) {
                alert("Vui lòng nhập địa chỉ email của bạn");
                document.forms["lienhe"]["email"].focus();
                return false;
            }

            if (phone.length == 0) {
                alert("Vui lòng nhập số điện thoại của bạn");
                document.forms["lienhe"]["phone"].focus();
                return false;
            }

            if (message.length == 0) {
                alert("Vui lòng nhập nội dung liên hệ");
                document.forms["lienhe"]["message"].focus();
                return false;
            }

            alert("Cảm ơn bạn đã liên hệ với chúng tôi!");
            return false;
        }
    </script>

    <style>

body{
    background:
    linear-gradient(180deg,#f8fbff,#eef5ff);
    font-family:'Poppins',sans-serif;
    color:#1e293b;
}

/* HERO */

#head{
    height:550px !important;
    background-size:cover;
    background-position:center;
    position:relative;
}

#head::before{
    content:"";
    position:absolute;
    inset:0;
    background:
    linear-gradient(
        rgba(15,23,42,0.45),
        rgba(15,23,42,0.55)
    );
}

.hero-content{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    color:white;
}

.hero-content h1{
    font-size:58px;
    font-weight:800;
    margin-bottom:15px;
}

.hero-content p{
    font-size:20px;
    opacity:0.95;
}

/* SECTION */

.contact-section{
    margin-top:-80px;
    position:relative;
    z-index:5;
}

.contact-card{
    background:white;
    border-radius:30px;
    padding:45px;
    box-shadow:
    0 20px 50px rgba(15,23,42,0.08);
}

/* INFO BOX */

.info-box{
    background:
    linear-gradient(135deg,#eff6ff,#ffffff);
    border-radius:25px;
    padding:35px;
    height:100%;
    border:1px solid #e2e8f0;
}

.info-item{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
}

.info-icon{
    width:60px;
    height:60px;
    border-radius:18px;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
}

.info-text h5{
    margin:0;
    font-weight:700;
}

.info-text p{
    margin:0;
    color:#64748b;
}

/* IMAGE */

.contact-image{
    width:100%;
    border-radius:24px;
    margin-top:20px;
    box-shadow:
    0 15px 40px rgba(0,0,0,0.12);
}

/* FORM */

.form-card{
    background:white;
    border-radius:25px;
    padding:35px;
    border:1px solid #e2e8f0;
}

.form-control{
    border-radius:16px !important;
    border:1px solid #dbeafe;
    min-height:58px;
    box-shadow:none !important;
}

.form-control:focus{
    border-color:#2563eb;
}

textarea.form-control{
    min-height:150px;
}

.btn-send{
    background:
    linear-gradient(
        135deg,
        #2563eb,
        #3b82f6
    );
    border:none;
    color:white;
    font-size:18px;
    font-weight:600;
    padding:16px;
    border-radius:18px;
    transition:0.3s;
}

.btn-send:hover{
    transform:translateY(-3px);
}

/* MAP */

.map-section{
    margin-top:60px;
}

.map-card{
    background:white;
    border-radius:30px;
    overflow:hidden;
    padding:30px;
    box-shadow:
    0 20px 50px rgba(15,23,42,0.08);
}

.map-image{
    width:100%;
    border-radius:20px;
}

/* MOBILE */

@media(max-width:768px){

    .hero-content h1{
        font-size:38px;
    }

    .contact-card{
        padding:25px;
    }
}

</style>
