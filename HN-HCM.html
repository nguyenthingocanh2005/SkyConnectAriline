<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyến bay Hà Nội - Hồ Chí Minh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* CSS styles giữ nguyên như trước */
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>Thông tin chuyến bay từ Hà Nội đến Hồ Chí Minh</h1>
        <div id="flights"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetchFlightData('HAN', 'SGN');
        });

        function fetchFlightData(departure, arrival) {
            const url = `https://flight-data4.p.rapidapi.com/get_airline_flights?departure=${departure}&arrival=${arrival}`;
            const options = {
                method: 'GET',
                headers: {
                    'X-RapidAPI-Key': 'bffca96712mshce6f5195f4334a3p17292ejsne4d677a6f3e4',
                    'X-RapidAPI-Host': 'flight-data4.p.rapidapi.com'
                }
            };

            fetch(url, options)
                .then(response => response.json())
                .then(data => {
                    displayFlights(data);
                })
                .catch(err => console.error(err));
        }

        function displayFlights(data) {
            const flightsDiv = document.getElementById('flights');
            flightsDiv.innerHTML = '';

            data.flights.forEach(flight => {
                const flightElement = document.createElement('div');
                flightElement.classList.add('card', 'mb-3');

                flightElement.innerHTML = `
                    <div class="card-body">
                        <h5 class="card-title">${flight.airline}</h5>
                        <p class="card-text">Số hiệu chuyến bay: ${flight.flightNumber}</p>
                        <p class="card-text">Khởi hành: ${flight.departureTime}</p>
                        <p class="card-text">Đến nơi: ${flight.arrivalTime}</p>
                    </div>
                `;

                flightsDiv.appendChild(flightElement);
            });
        }
    </script>
</body>
</html>
