<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lịch sử đặt vé</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    font-family:'Poppins',sans-serif;
    box-sizing:border-box;
}

body{

    background:
    radial-gradient(circle at top left,#dbeafe 0%,transparent 28%),
    radial-gradient(circle at top right,#bfdbfe 0%,transparent 25%),
    #f8fafc;

    min-height:100vh;

    padding:35px 20px;

    color:#0f172a;
}

.page-box{
    max-width:1200px;
    margin:auto;
}

/* ======================
   HEADER
====================== */

.title{

    font-size:42px;
    font-weight:700;

    margin-bottom:8px;

    color:#0f172a;
}

.sub{

    color:#64748b;

    margin-bottom:35px;

    font-size:16px;
}

/* ======================
   CARD
====================== */

.ticket-card{

    background:
    rgba(255,255,255,0.85);

    backdrop-filter:blur(24px);

    border-radius:32px;

    padding:30px;

    margin-bottom:24px;

    border:
    1px solid rgba(255,255,255,0.8);

    box-shadow:
    0 15px 40px rgba(15,23,42,0.08);

    transition:.3s;
}

.ticket-card:hover{

    transform:
    translateY(-4px);

    box-shadow:
    0 20px 50px rgba(15,23,42,0.12);
}

/* ======================
   FLIGHT
====================== */

.route{

    font-size:30px;
    font-weight:700;

    color:#0f172a;
}

.time{

    font-size:16px;

    color:#64748b;

    margin-top:6px;
}

/* ======================
   PRICE
====================== */

.price{

    font-size:38px;
    font-weight:800;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #06b6d4
    );

    background-clip:text;
    -webkit-background-clip:text;

    color:transparent;
    -webkit-text-fill-color:transparent;
}

/* ======================
   TEXT
====================== */

.label{

    color:#64748b;

    font-size:14px;

    margin-bottom:5px;
}

.hash{

    word-break:break-all;

    font-size:14px;

    color:#334155;
}

/* ======================
   STATUS
====================== */

.status{

    display:inline-flex;

    align-items:center;

    gap:10px;

    background:#ecfdf5;

    border:
    1px solid #d1fae5;

    color:#059669;

    padding:12px 18px;

    border-radius:999px;

    font-weight:600;
}

.dot{

    width:10px;
    height:10px;

    border-radius:50%;

    background:#10b981;

    box-shadow:
    0 0 10px rgba(16,185,129,0.4);
}

/* ======================
   EMPTY
====================== */

.empty{

    text-align:center;

    padding:80px 20px;

    background:
    rgba(255,255,255,0.8);

    border-radius:32px;

    border:
    1px solid #e2e8f0;

    color:#64748b;

    box-shadow:
    0 10px 35px rgba(15,23,42,0.05);
}

/* ======================
   BUTTON
====================== */

.btn-custom{

    border:none;

    border-radius:18px;

    padding:14px 24px;

    font-weight:600;

    transition:.25s;
}

.btn-custom:hover{

    transform:
    translateY(-2px);
}

.btn-home{

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #3b82f6
    );

    color:white;

    box-shadow:
    0 10px 25px rgba(37,99,235,.25);
}

.btn-detail{

    background:#f1f5f9;

    border:
    1px solid #dbe2ea;

    color:#0f172a;
}

.btn-detail:hover{
    background:#e2e8f0;
}

/* ======================
   MOBILE
====================== */

@media(max-width:768px){

    .title{
        font-size:32px;
    }

    .ticket-card{
        padding:22px;
        border-radius:24px;
    }

    .route{
        font-size:24px;
    }

    .price{
        font-size:30px;
    }
}

</style>

</head>

<body>

<div class="page-box">

    <div class="title">
        📜 Lịch sử đặt vé
    </div>

    <div class="sub">
        Danh sách các chuyến bay đã thanh toán
    </div>

    <div class="mb-4">

        <button
            class="btn-custom btn-home"
            onclick="goHome()"
        >
            🏠 Về trang chủ
        </button>

    </div>

    <div id="historyContainer"></div>

</div>

<script src="js/history.js"></script>

</body>
</html>
