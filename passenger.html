<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thông tin hành khách</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f5f7fa;
}

.box{
    max-width:1000px;
    margin:auto;
    margin-top:40px;
}

.card-box{
    background:white;
    border-radius:18px;
    padding:30px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.flight-info{
    background:#eef5ff;
    border-radius:12px;
    padding:20px;
    margin-bottom:30px;
}

.time{
    font-size:28px;
    font-weight:700;
}

.price{
    color:#e53935;
    font-size:30px;
    font-weight:700;
}

/* ====================
   SEAT
==================== */

.seat-section{
    margin-top:20px;
}

.airplane{

    background:#f8fafc;

    border-radius:20px;

    padding:25px;

    border:
    1px solid #dbeafe;
}

.seat-grid{

    display:grid;

    grid-template-columns:
    repeat(6,55px);

    gap:12px;

    justify-content:center;
}

.seat{

    width:48px;
    height:48px;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:600;

    cursor:pointer;

    transition:.25s;
}

.seat:hover{
    transform:translateY(-2px);
}

/* ghế trống */

.seat.free{

    background:#e0f2fe;
    color:#0284c7;
}

/* ghế đang chọn */

.seat.selected{

    background:#2563eb;
    color:white;
}

/* ghế bị khóa */

.seat.occupied{

    background:#e2e8f0;
    color:#64748b;

    cursor:not-allowed;
}

/* chú thích */

.seat-legend{

    display:flex;
    gap:30px;

    margin-bottom:20px;
}

.seat-legend div{

    display:flex;
    align-items:center;
    gap:10px;
}

.seat-legend .seat{

    width:22px;
    height:22px;

    border-radius:8px;
}

</style>

</head>

<body>

<div class="container box">

    <div class="card-box">

        <h2 class="mb-4">
            🧍 Thông tin hành khách
        </h2>

        <!-- flight info -->
        <div class="flight-info">

            <div class="row align-items-center">

                <div class="col-md-5 text-center">

                    <div id="depAirport"></div>

                    <div class="time" id="depTime">
                        08:30
                    </div>

                    <div id="depDate"></div>

                </div>

                <div class="col-md-2 text-center">

                    ✈️

                </div>

                <div class="col-md-5 text-center">

                    <div id="arrAirport"></div>

                    <div class="time" id="arrTime">
                        10:15
                    </div>

                    <div id="arrDate"></div>

                </div>

            </div>

        </div>

        <!-- form -->
        <form id="passengerForm">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Họ và tên
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="fullname"
                        required
                    >

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        CCCD / Passport
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="cccd"
                        required
                    >

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Số điện thoại
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="phone"
                        required
                    >

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        required
                    >

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Ngày sinh
                    </label>

                    <input
                        type="date"
                        class="form-control"
                        id="birthday"
                        required
                    >

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Giới tính
                    </label>

                    <select
                        class="form-select"
                        id="gender"
                    >

                        <option>Nam</option>
                        <option>Nữ</option>
                        <option>Khác</option>

                    </select>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Số lượng vé
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="ticketCount"
                        value="1"
                        readonly
                    >

                </div>

            </div>

            <div class="seat-section mt-4">

            <h4 class="mb-3">
                💺 Chọn chỗ ngồi
            </h4>

            <div class="seat-legend">

                <div>
                    <span class="seat free"></span>
                    Trống
                </div>

                <div>
                    <span class="seat selected"></span>
                    Đã chọn
                </div>

                <div>
                    <span class="seat occupied"></span>
                    Đã đặt
                </div>

            </div>

            <div class="airplane">

                <div class="seat-grid" id="seatGrid">
                </div>

            </div>

            <div class="mt-3">

                Ghế đã chọn:
                <strong id="selectedSeat">
                    Chưa chọn
                </strong>

            </div>

        </div>

            <hr class="my-4">

            <div class="d-flex justify-content-between align-items-center">

                <div class="price" id="price">
                    2.500.000đ
                </div>

                <button
                    type="submit"
                    class="btn btn-danger btn-lg"
                >
                    Tiếp tục thanh toán
                </button>

            </div>

        </form>

    </div>

</div>

<script src="js/passenger.js"></script>

</body>
</html>
