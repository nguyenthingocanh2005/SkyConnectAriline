<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.1.1/css/all.css" integrity="sha384-O8whS3fhG2OnA5Kas0Y9l3cfpmYjapjI0E4theH4iuMD+pLhbf6JI0jIMfYcK3yZ" crossorigin="anonymous">
    <link rel="icon" href="images/logo.png" type="image/x-icon">

    <style>
        .contact-form {
            width: 300px;
            position: absolute;
            top: 200px;
            right: 100px;
            max-width: 700px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f8f9fa;
            z-index: 2;
            transition: top 0.3s ease-in-out;     
        }

        @media (max-width: 576px) {
            .contact-form {
                position: relative;
                top: 20px;
                right: auto;
                width: 100%;
                margin: 0 auto;
            }

            #head {
                height: auto;
                padding-bottom: 20px; /* Đảm bảo khoảng trống dưới đủ để form di chuyển */
            }
        }

        .contact-form.shifted {
            top: 380px; /* Điều chỉnh giá trị này để di chuyển form */
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            function validateForm() {
                var tdn = document.forms["dangnhap"]["tdn"].value;
                var mk = document.forms["dangnhap"]["mk"].value;
                if (tdn == "") {
                    alert("Hãy điền tên đăng nhập");
                    document.forms["dangnhap"]["tdn"].focus();
                    return false;
                }
                if (mk == "") {
                    alert("Hãy nhập mật khẩu");
                    document.forms["dangnhap"]["mk"].focus();
                    return false;
                }
                return true;
            }

            document.querySelector('form[name="dangnhap"]').onsubmit = validateForm;

            // Xử lý khi mở thanh điều hướng
            document.querySelector('#navbarSupportedContent').addEventListener('show.bs.collapse', function() {
                const form = document.querySelector('.contact-form');
                form.classList.add('shifted');
            });

            // Xử lý khi đóng thanh điều hướng
            document.querySelector('#navbarSupportedContent').addEventListener('hide.bs.collapse', function() {
                const form = document.querySelector('.contact-form');
                form.classList.remove('shifted');
            });
        });
    </script>
</head>
<body>
    <div id="header"></div>

    <div id="head" style="background-image: url('images/dangky.jpg'); height: 630px;">
        <div id="form" class="contact-form" style="text-align:center; padding:40px;">

            <h3>Đăng nhập</h3>
            <p>Đăng nhập bằng Google</p>

            <button id="googleLogin" class="btn btn-danger">
                <i class="fab fa-google"></i> Đăng nhập với Google
            </button>

            <p id="userInfo" style="margin-top:15px;"></p>

        </div>
    </div>

    <div id="footer"></div>
    <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>

    <script type="module" src="js/auth.js"></script>
    <script src="js/navbar.js"></script>
    <script type="module" src="js/firebase-login.js"></script>
</body>
</html>
