<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chi tiết chuyến bay</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f5f7fa;
}

.detail-box{
    max-width:1000px;
    margin:auto;
    margin-top:40px;
}

.flight-card{
    background:white;
    border-radius:18px;
    padding:30px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.time{
    font-size:34px;
    font-weight:700;
}

.airport{
    font-size:18px;
    font-weight:600;
}

.date{
    color:#666;
}

.price{
    color:#e53935;
    font-size:34px;
    font-weight:700;
}

.section{
    margin-top:30px;
    padding-top:20px;
    border-top:1px solid #eee;
}

.badge-info{
    background:#eef5ff;
    color:#1565c0;
    padding:8px 14px;
    border-radius:10px;
    display:inline-block;
    margin-right:10px;
    margin-top:10px;
}

</style>
</head>

<body>

<div class="container detail-box">

    <div class="flight-card">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 id="airlineName">Vietnam Airlines</h2>

                <div id="flightCode" class="text-muted">
                    VN245
                </div>

            </div>

            <div class="price" id="price">
                2.500.000đ
            </div>

        </div>

        <div class="row align-items-center text-center">

            <!-- đi -->
            <div class="col-md-5">

                <div class="airport" id="depAirport">
                    Hồ Chí Minh
                </div>

                <div class="time" id="depTime">
                    08:30
                </div>

                <div class="date" id="depDate">
                    2026-05-10
                </div>

            </div>

            <!-- icon -->
            <div class="col-md-2">

                <div style="font-size:40px">
                    ✈️
                </div>

                <div id="duration">
                    1h45m
                </div>

            </div>

            <!-- đến -->
            <div class="col-md-5">

                <div class="airport" id="arrAirport">
                    Đà Nẵng
                </div>

                <div class="time" id="arrTime">
                    10:15
                </div>

                <div class="date" id="arrDate">
                    2026-05-10
                </div>

            </div>

        </div>

        <!-- info -->
        <div class="section">

            <h4>Thông tin vé</h4>

            <div class="badge-info">
                Hành lý xách tay: 7kg
            </div>

            <div class="badge-info">
                Hành lý ký gửi: 20kg
            </div>

            <div class="badge-info">
                Hoàn vé: Không hỗ trợ
            </div>

            <div class="badge-info">
                Đổi giờ bay: Có phí
            </div>

        </div>

        <!-- button -->
        <div class="section text-end">

            <button class="btn btn-danger btn-lg" id="btnBook">
                Tiếp tục đặt vé
            </button>

        </div>

    </div>

</div>

<script src="js/flight-detail.js"></script>

</body>
</html>
